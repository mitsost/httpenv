# This workflow builds a Docker image and pushes it to Docker Hub.
# It is triggered on pushes to the main branch and on pull requests.
# The image is tagged with the latest version and a specific version (01).
# The workflow uses the docker/build-push-action to build and push the image.
# The docker/login-action is used to log in to Docker Hub using secrets for the username and token.
# The workflow is set to run on the latest version of Ubuntu.
# The workflow is named "01 Basic Docker Build" and is the simplest workflow possible.
# The workflow is defined in YAML format and uses GitHub Actions syntax.
# The workflow is defined in the .github/workflows directory of the repository.
# The workflow is triggered on pushes to the main branch and on pull requests.

name: 01 Basic Docker Build
# simplest workflow possible

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
            
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: mitsost/httpenv,mitsost/httpenv:01
